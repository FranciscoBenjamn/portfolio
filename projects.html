<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — The Cave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="projects-page fade-in">
      <header class="projects-header">
        <a href="about.html" class="back-link projects-header__left">About</a>
        <h1>Inside the Cave</h1>
        <a href="index.html" class="back-link">Surface</a>
      </header>

      <div class="carousel-wrap">
        <div class="carousel" id="carousel" aria-label="Project carousel"></div>
        <div class="carousel-dots" id="dots" aria-hidden="true"></div>
      </div>
    </div>

    <script src="js/projects.js"></script>
    <script>
      const carousel = document.getElementById("carousel");
      const dotsContainer = document.getElementById("dots");

      PROJECTS.forEach((project) => {
        const card = document.createElement("article");
        card.className = "carousel__card";
        const primaryLink = project.live ?? project.github;
        const primaryLabel = project.live ? "View ↗" : "View on GitHub ↗";
        const githubLinkHtml = project.live
          ? `<a class="carousel__card-link" href="${project.github}" target="_blank" rel="noopener noreferrer" aria-label="${project.title} repository on GitHub (opens in new tab)">View on GitHub ↗</a>`
          : "";
        card.innerHTML = `
          <img src="${project.image}" alt="" loading="lazy" />
          <div class="carousel__card-body">
            <h2>${project.title}</h2>
            <p>${project.tagline}</p>
            <a class="carousel__card-link" href="${primaryLink}" target="_blank" rel="noopener noreferrer">${primaryLabel}</a>
            ${githubLinkHtml}
          </div>
        `;
        carousel.appendChild(card);

        const dot = document.createElement("span");
        dotsContainer.appendChild(dot);
      });

      const dots = [...dotsContainer.children];
      const cards = [...carousel.children];

      function updateDots() {
        const scrollLeft = carousel.scrollLeft;
        const cardWidth = cards[0]?.offsetWidth ?? 1;
        const gap = 24;
        const index = Math.round(scrollLeft / (cardWidth + gap));
        dots.forEach((d, i) => d.classList.toggle("active", i === index));
      }

      carousel.addEventListener("scroll", () => {
        requestAnimationFrame(updateDots);
      });

      updateDots();
    </script>
  </body>
</html>
